[project]
name = "satellite"
version = "2.0.0"
description = "Core-to-edge pipeline demo on HPE Ezmeral Data Fabric with VLM analysis"
readme = "README.md"
authors = [
    { name = "Erdinc Kaya", email = "erdincka@msn.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Data Fabric access, all over the network - no native client required.
    "boto3>=1.35.0",          # S3 gateway (assets + iceberg warehouse)
    "confluent-kafka>=2.6.0", # Streams via the Kafka Wire Protocol gateway
    "httpx>=0.28.1",          # REST apiserver
    "nicegui>=2.18.0",
    "openai>=1.82.0",
    "pandas>=2.2.3",
    "pyiceberg[pyarrow,s3fs,sql-sqlite]>=0.9.1",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
