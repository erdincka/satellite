<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#0B1220"/>
  <style>
    .ttl { fill:#E8EDF4; font-size:15px; font-weight:600 }
    .sub { fill:#7B8798; font-size:11.5px }
    .ax  { fill:#7B8798; font-size:10.5px }
    .lg  { fill:#AFBBCB; font-size:11.5px }
    .ph  { fill:#7B8798; font-size:10.5px; letter-spacing:.06em }
  </style>

  <text x="40" y="34" class="ttl">Cutting the link, and restoring it</text>
  <text x="40" y="53" class="sub">Messages published at HQ against messages received at the edge. Measured, not simulated.</text>

  <!-- phase bands -->
  <rect x="70" y="72" width="150" height="182" fill="#10B98112"/>
  <rect x="220" y="72" width="220" height="182" fill="#F43F5E14"/>
  <rect x="440" y="72" width="370" height="182" fill="#10B98112"/>
  <text x="145" y="88" class="ph" text-anchor="middle">CONNECTED</text>
  <text x="330" y="88" class="ph" text-anchor="middle" fill="#FB7185">LINK CUT</text>
  <text x="625" y="88" class="ph" text-anchor="middle">RESTORED</text>

  <!-- axes -->
  <line x1="70" y1="254" x2="810" y2="254" stroke="#1E2A3B" stroke-width="1"/>
  <line x1="70" y1="72" x2="70" y2="254" stroke="#1E2A3B" stroke-width="1"/>
  <text x="62" y="258" class="ax" text-anchor="end">0</text>
  <text x="62" y="167" class="ax" text-anchor="end">24</text>
  <text x="62" y="80" class="ax" text-anchor="end">48</text>

  <!-- published at HQ: 8, 15, 23, 29, 35, 40, 45  (scale: y = 254 - v*3.79) -->
  <polyline fill="none" stroke="#2AA198" stroke-width="2.5"
            points="70,224 220,197 330,167 440,144 550,121 680,102 810,84"/>
  <!-- received at edge: 7, 8, 8, 8, 26, 40, 44 -->
  <polyline fill="none" stroke="#D98A2B" stroke-width="2.5"
            points="70,227 220,224 330,224 440,224 550,155 680,102 810,87"/>

  <!-- the gap, called out -->
  <line x1="440" y1="144" x2="440" y2="224" stroke="#FB7185" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="452" y="188" fill="#FB7185" font-size="11.5">21 queued</text>

  <circle cx="680" cy="102" r="4" fill="#D98A2B"/>
  <text x="668" y="128" fill="#D98A2B" font-size="11.5" text-anchor="middle">drained</text>

  <!-- legend -->
  <circle cx="80" cy="288" r="4" fill="#2AA198"/>
  <text x="92" y="292" class="lg">Published at HQ</text>
  <circle cx="230" cy="288" r="4" fill="#D98A2B"/>
  <text x="242" y="292" class="lg">Received at the edge</text>
  <text x="800" y="292" class="sub" text-anchor="end">Data Fabric 8.1 · multi-master stream pair</text>
</svg>
